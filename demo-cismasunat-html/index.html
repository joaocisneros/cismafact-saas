<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cisma Fact Sandbox</title>
<meta name="description" content="Consola para probar la API de facturación electrónica de Cisma Fact contra SUNAT beta.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<div class="app">

  <aside class="rail">
    <div class="brand">
      <span class="brand-name">Cisma Fact <b>Sandbox</b></span>
      <span class="brand-sub">Consola de la API</span>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="rail-foot">
      <div class="conn">
        <span class="dot" id="cn-punto"></span>
        <span id="cn-texto">Sin configurar</span>
      </div>
      <span class="conn-ruc" id="cn-ruc"></span>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="titulo">Panel</h1>
        <span class="sub" id="subtitulo"></span>
      </div>
    </header>

    <div class="view" id="vista"></div>

    <section class="console closed" id="consola">
      <div class="console-head" id="consola-head">
        <span class="t">
          Consola de llamadas
          <span id="consola-cuenta" style="color:var(--muted)"></span>
        </span>
        <button class="btn sm ghost" id="consola-limpiar">Limpiar</button>
      </div>
      <div class="console-list" id="consola-lista"></div>
    </section>
  </main>

</div>

<div class="scrim" id="scrim"></div>
<div class="toasts" id="toasts"></div>

<script src="js/core.js"></script>
<script src="js/ui.js"></script>
<script src="js/data.js"></script>
<script src="js/views-basicas.js"></script>
<script src="js/views-emitir.js"></script>
<script src="js/app.js"></script>
</body>
</html>
